name: Project N quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php --version | tee "$RUNNER_TEMP/php-syntax.log"
          while IFS= read -r -d '' file; do
            printf '\\n--- %s ---\\n' "$file" | tee -a "$RUNNER_TEMP/php-syntax.log"
            php -l "$file" 2>&1 | tee -a "$RUNNER_TEMP/php-syntax.log"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Upload PHP syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-syntax-${{ matrix.php }}
          path: ${{ runner.temp }}/php-syntax.log
          if-no-files-found: ignore
          retention-days: 7
