name: Reusable platform installation and tests

on:
  workflow_call:
    inputs:
      platform:
        description: Moodle or Iomad
        required: true
        type: string
      version:
        description: Platform version label
        required: true
        type: string
      repository:
        description: Project fork in owner/repository format
        required: true
        type: string
      branch:
        description: Exact stable branch in the project fork
        required: true
        type: string
      run_axe:
        description: Run browser-based axe-core audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.platform }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moodle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MOODLE_REPOSITORY: ${{ inputs.repository }}
      MOODLE_BRANCH: ${{ inputs.branch }}
      PLATFORM: ${{ inputs.platform }}
      PLATFORM_VERSION: ${{ inputs.version }}
      DB_NAME: moodle
      DB_USER: root
      DB_PASSWORD: root
      ADMIN_USER: admin
      ADMIN_PASSWORD: MoodleCI-Strong!2026
      ADMIN_EMAIL: ci-admin@example.invalid
      MOODLE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout Project N
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, exif, gd, intl, mbstring, mysqli, soap, sodium, xml, zip
          coverage: none
          ini-values: memory_limit=512M, max_input_vars=5000

      - name: Clone selected project fork branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$MOODLE_BRANCH" "https://github.com/$MOODLE_REPOSITORY.git" "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" log -1 --format='Testing source commit: %H%nSubject: %s'
          echo "MOODLE_DIR=$RUNNER_TEMP/platform" >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        working-directory: ${{ runner.temp }}/platform
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Project N into the platform
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$MOODLE_DIR/public" && -f "$MOODLE_DIR/public/index.php" ]]; then
            WEBROOT="$MOODLE_DIR/public"
          else
            WEBROOT="$MOODLE_DIR"
          fi
          mkdir -p "$WEBROOT/theme/projectn"
          git archive HEAD | tar -x -C "$WEBROOT/theme/projectn"
          echo "MOODLE_WEBROOT=$WEBROOT" >> "$GITHUB_ENV"
          echo "PROJECTN_PLUGIN_DIR=$WEBROOT/theme/projectn" >> "$GITHUB_ENV"

      - name: Install Moodle or Iomad
        working-directory: ${{ runner.temp }}/platform
        shell: bash
        run: |
          set -euo pipefail
          php admin/cli/install.php \
            --lang=en \
            --wwwroot="$MOODLE_URL" \
            --dataroot="$RUNNER_TEMP/platform-data" \
            --dbtype=mysqli \
            --dbhost=127.0.0.1 \
            --dbname="$DB_NAME" \
            --dbuser="$DB_USER" \
            --dbpass="$DB_PASSWORD" \
            --prefix=mdl_ \
            --fullname="Project N CI $PLATFORM $PLATFORM_VERSION" \
            --shortname=projectn-ci \
            --adminuser="$ADMIN_USER" \
            --adminpass="$ADMIN_PASSWORD" \
            --adminemail="$ADMIN_EMAIL" \
            --non-interactive \
            --agree-license
          php admin/cli/cfg.php --name=theme --set=projectn

      - name: Install locale required by PHPUnit
        run: |
          sudo apt-get update
          sudo apt-get install --yes locales
          sudo sed -i '/^# *en_AU.UTF-8 UTF-8/s/^# *//' /etc/locale.gen
          sudo locale-gen en_AU.UTF-8
          locale -a | grep -i '^en_AU\.utf8$'

      - name: Initialise PHPUnit environment
        working-directory: ${{ runner.temp }}/platform
        shell: bash
        run: |
          set -euo pipefail
          cat >> config.php <<'PHPUNITCONFIG'

          // Dedicated PHPUnit data directory for this CI job.
          $CFG->phpunit_prefix = 'phpu_';
          $CFG->phpunit_dataroot = getenv('RUNNER_TEMP') . '/phpunit-${{ inputs.platform }}-${{ inputs.version }}';
          PHPUNITCONFIG
          if [[ -f public/admin/tool/phpunit/cli/init.php ]]; then
            PHPUNIT_INIT=public/admin/tool/phpunit/cli/init.php
          else
            PHPUNIT_INIT=admin/tool/phpunit/cli/init.php
          fi
          php "$PHPUNIT_INIT"

      - name: Run Project N PHPUnit tests
        working-directory: ${{ runner.temp }}/platform
        shell: bash
        run: |
          set -euo pipefail
          # Moodle test files use the *_test.php suffix, not PHPUnit's default *Test.php.
          # Fail the job if discovery ever returns an empty suite.
          # PHPUnit 11 supports this diagnostic option; PHPUnit 9 (Moodle/Iomad 4.5) does not.
          PHPUNIT_VERSION="$(vendor/bin/phpunit --version)"
          PHPUNIT_MAJOR="${PHPUNIT_VERSION#* }"
          PHPUNIT_MAJOR="${PHPUNIT_MAJOR%%.*}"
          PHPUNIT_ARGS=(
            --test-suffix _test.php
            --fail-on-empty-test-suite
          )
          if [[ "$PHPUNIT_MAJOR" -ge 11 ]]; then
            PHPUNIT_ARGS+=(--display-phpunit-deprecations)
          fi
          vendor/bin/phpunit "${PHPUNIT_ARGS[@]}" "$PROJECTN_PLUGIN_DIR/tests"

      - name: Prepare a real learner and enrolled course
        if: inputs.run_axe
        working-directory: ${{ runner.temp }}/platform
        env:
          MOODLE_DIR: ${{ runner.temp }}/platform
        run: php "$PROJECTN_PLUGIN_DIR/tests/ci/prepare-learner.php"

      - name: Install Playwright and axe-core
        if: inputs.run_axe
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium

      - name: Start platform web server
        if: inputs.run_axe
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8000 -t "$MOODLE_WEBROOT" > "$RUNNER_TEMP/platform-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$MOODLE_URL/login/index.php" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/platform-server.log"
          exit 1

      - name: Verify learner course access and responsive formats
        if: inputs.run_axe
        env:
          BASE_URL: ${{ env.MOODLE_URL }}
        run: node tests/ci/learner-course-check.cjs

      - name: Run axe-core browser audit
        if: inputs.run_axe
        env:
          BASE_URL: ${{ env.MOODLE_URL }}
          ADMIN_USERNAME: ${{ env.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          PLATFORM_NAME: ${{ inputs.platform }}
          PLATFORM_VERSION: ${{ inputs.version }}
        run: node tests/ci/axe-audit.cjs

      - name: Upload axe reports and screenshots
        if: always() && inputs.run_axe
        uses: actions/upload-artifact@v4
        with:
          name: axe-${{ inputs.platform }}-${{ inputs.version }}
          path: artifacts/axe/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server log on failure
        if: failure() && inputs.run_axe
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ inputs.platform }}-${{ inputs.version }}
          path: ${{ runner.temp }}/platform-server.log
          if-no-files-found: ignore
          retention-days: 7
